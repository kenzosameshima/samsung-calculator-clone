<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
    <script src="script/evaluate.js" defer></script>
    <script src="script/calculator.js" defer></script>
    <script src="script/script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <main class="container">
        <section class="calculator dark" aria-labelledby="calculator-heading">
            <h1 id="calculator-heading" class="visually-hidden">Calculator</h1>

            <button type="button" id="history-toggle" class="mode-toggler" aria-label="History">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.5H8"/><path d="M12 7.5V12l3 2"/></svg>
            </button>
            <button type="button" id="sci-toggle" class="mode-toggler" aria-pressed="false" aria-label="Toggle scientific mode">
                <svg class="icon icon-scientific" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 12.5l2.2 2.8 3-6.3h4.3"/></svg>
                <svg class="icon icon-basic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M6.5 8.5h4M8.5 6.5v4M13.5 15.5h4"/><circle cx="15.5" cy="13.4" r=".5"/><circle cx="15.5" cy="17.6" r=".5"/></svg>
            </button>
            <button type="button" id="rotate-toggle" class="mode-toggler rotate-toggler" aria-pressed="false" aria-label="Toggle landscape layout">&#8635;</button>
            <button type="button" class="theme-toggler active" aria-label="Toggle light and dark theme"></button>

            <output id="display" aria-live="polite" aria-atomic="true"></output>
            <output id="preview" aria-hidden="true"></output>
            <div id="toast" class="toast" role="status" hidden></div>

            <div class="pad">
                <div class="buttons scientific-buttons" id="scientific-buttons" role="group" aria-label="Scientific functions" hidden>
                    <button type="button" class="btn-operator" id="sci-shift" aria-pressed="false" aria-label="Shift">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8h15M15 4l4 4-4 4"/><path d="M20 16H5M9 12l-4 4 4 4"/></svg>
                    </button>
                    <button type="button" class="btn-operator" id="sci-angle" aria-label="Angle unit: degrees">Deg</button>
                </div>

                <div class="buttons" id="keypad" role="group" aria-label="Calculator keypad">
                    <button type="button" class="btn-operator" id="clear" data-type="clear" aria-label="Clear">C</button>
                    <button type="button" class="btn-operator" data-type="backspace" aria-label="Backspace">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5.5h10.5A1.5 1.5 0 0 1 21 7v10a1.5 1.5 0 0 1-1.5 1.5H9L2.8 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
                    </button>
                    <button type="button" class="btn-operator" data-type="postfix" data-value="%" aria-label="Percent">&percnt;</button>
                    <button type="button" class="btn-operator" data-type="operator" data-value="/" aria-label="Divide">&divide;</button>

                    <button type="button" class="btn-number" data-type="digit" data-value="7">7</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="8">8</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="9">9</button>
                    <button type="button" class="btn-operator" data-type="operator" data-value="*" aria-label="Multiply">&times;</button>

                    <button type="button" class="btn-number" data-type="digit" data-value="4">4</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="5">5</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="6">6</button>
                    <button type="button" class="btn-operator" data-type="operator" data-value="-" aria-label="Subtract">-</button>

                    <button type="button" class="btn-number" data-type="digit" data-value="1">1</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="2">2</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="3">3</button>
                    <button type="button" class="btn-operator" data-type="operator" data-value="+" aria-label="Add">+</button>

                    <button type="button" class="btn-operator" data-type="paren" aria-label="Parenthesis">()</button>
                    <button type="button" class="btn-number" data-type="digit" data-value="0">0</button>
                    <button type="button" class="btn-operator" data-type="decimal" aria-label="Decimal point">.</button>
                    <button type="button" class="btn-operator btn-equal" data-type="equals" aria-label="Equals">=</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
